# The one serving configuration of the TP2 DeepSeek-V4.1 port on the two Strix Halo boxes (handoff section 10): both
# rank scripts (serve-rank0.sh, serve-rank1.sh) and first_light.sh read this file, and only this file; serve_lib.sh
# resolves it into each rank's command and environment and writes the resolved form (resolved.json) with every run.
# A value here that the two ranks must share is written once and passed to both (upstream #25: rank 1's --streams,
# --pool and --round-rows equal rank 0's TF_DS_STREAMS, --context and TF_DS_ROUND_ROWS).
# Paths are on each box (the same layout on both, BUILD_AND_RUN.md); $HOME is the box's own.

# ---- the ranks (rank 0 = node0, the coordinator; rank 1 = node1)
WORLD=2
RANK0_HOST=node0                 # ssh name from node1 (first_light.sh runs on node1, the build box)
RANK1_HOST=node1
MASTER_IP=192.168.241.1
TP_PORT=29620                    # the ranks' link port (TF_TP_PORT); the transport's own ports are its (w-link)
# the transport's settings (tcp_coll.zig), the same on both ranks (its handshake compares them)
TP_DATA_PORT=                    # TF_TP_DATA_PORT: empty = the control port + 16
TP_STRIPE=
                                 # 2048-row chunk's gathers 593 ms striped vs 810 on one cable, w-link, MTU 1500)
COLL_STRIPE_MIB=4                # TF_COLL_STRIPE_MIB: payloads from this size split over both links (with TP_STRIPE)
COLL_RTO_MIN_US=8000             # TF_COLL_RTO_MIN_US
COLL_PROGRESS_MS=2000            # TF_COLL_PROGRESS_MS: a call that sees no progress this long fails (Timeout)
COLL_GPU_WAIT_S=10               # TF_COLL_GPU_WAIT_S (1-600; empty: the engine's 10): a GPU wait inside a collective longer
                                 # than this fails the pair (tcp_host: this rank's block reaching pinned memory, the last
                                 # upload; tcp_proxy: the device's wait for a free slot and for the peer's block). A dead
                                 # peer does not wait for it (its closed sockets fail the next exchange at once) and a
                                 # silent one fails at COLL_PROGRESS_MS
COLL_GPU_WARN_S=2                # TF_COLL_GPU_WARN_S (0-600, 0 off; this rank's own): a GPU wait or proxy exchange longer
                                 # than this logs one line as it ends (rank, site, bytes, chunk, ms, how it ended)
COLL_STAGING=dma                 # TF_COLL_STAGING: blit | dma
COLL_CHUNK_MIB=4                 # eager pipeline chunk size; also the verbs host window payload capacity
COLL_KIND=proxy                  # TF_COLL_KIND: proxy (TCP graphs) | host (eager TCP) | verbs (RC verbs graphs)
COLL_VERBS_DEVICE_RANK0=          # local HCA for verbs only (e.g. usb4_rdma0); clear TP_STRIPE and COLL_PROXY_STRIPE_KIB
COLL_VERBS_DEVICE_RANK1=
COLL_VERBS_GID_INDEX_RANK0=1
COLL_VERBS_GID_INDEX_RANK1=1
COLL_PROXY_CPU=6                 # TF_COLL_PROXY_CPU (proxy only): the proxy thread's core; nothing else may spin there,
                                 # so a proxy run keeps the ranks off it and its SMT sibling (ENGINE_CPUS)
COLL_PROXY_CPU2=7                # TF_COLL_PROXY_CPU2 (proxy only, with COLL_PROXY_STRIPE_KIB > 0): the second proxy thread's
                                 # core (the second cable's half of each split gather)
ENGINE_CPUS=0-5,8-21,24-31       # taskset -c for both ranks (empty: unpinned): off the proxy threads' cores 6 and 7 and
                                 # their SMT siblings 22 and 23
WRAP0=                           # a command rank 0 runs inside (its words, an absolute path first), e.g. a profiler:
WRAP1=                           # /opt/rocm/bin/rocprofv3 --kernel-trace --output-format csv -d /abs/dir --  (empty: none)
COLL_SLOT_KIB=4352               # TF_COLL_SLOT_KIB (proxy only): the largest gather a slot holds; a larger one goes through
                                 # tcp_host and cannot be captured, so GRAPHS=1 needs ROUND_ROWS*64640*4 B (the head) to fit
COLL_PROXY_STRIPE_KIB=0
                                 # many KiB is split, its second half moved over the second cable by a second proxy
                                 # thread (one thread moves ~1.6 GB/s each way whatever the cables); 0 = all on the first
                                 # cable, as before 2026-10-20. coll-check passes, p50, 0 -> 16: 1-row 2.16 -> 1.82 ms,
                                 # 6-row DSpark 7.1-7.3 -> 5.3, 16-row 17.0-22.1 -> 12.2-13.0 (64 KiB: 1-row 2.09)

# ---- the build both ranks run: one commit, deployed with deploy_rank0.sh --native (SHA-256 checked on arrival)
DEPLOY_DIR='$HOME/tfp/deploy/current'      # on each box: native-hip/bin/{tensorfold-native,tf-dsv41-lanes}, the kit
KIT_SUBDIR=native-hip/share/tensorfold/hip/gfx1151/dsv41   # the AMD kit inside the deployment (with the Triton kit, tri/README.md)

# ---- the model and its inputs (BUILD_AND_RUN.md sections 1 and 3)
BUNDLE='$HOME/models/tf-port/inputs-tp2-c178a012'
MODEL_DIR='$BUNDLE/model'                   # config.json, tokenizer.json and chat_template.jinja (c282975e): the
                                            # bundle's, under its manifest (the checkpoint dir has no template)
RANK_CACHE='$BUNDLE/rank$RANK/rank-cache'  # TF_DS_RANK_CACHE (each rank's own file)
DS_KIT='$DEPLOY_DIR/ds-kit'                 # TF_DS_KIT: engram.json and the RoPE tables (the deploy's: rows in
                                            # its rope.json; the bundles' own kit has 65,536)
ENGRAM_DIR='$HOME/models/tf-port/ds1017-1bae0e10'
TOKEN_MAP='$BUNDLE/dsv41_token_map.json'
BUNDLE_SHA256=243b984d1069b190e762b3f9eaf12c90b2a23dd1e8f33880019f60d61264e8e9   # inputs_manifest.json

# ---- the engine (first light: one stream, 8K, greedy, untuned)
CONTEXT=65487
STREAMS=1                        # TF_DS_STREAMS / rank 1 --streams
PARALLEL=1                       # the server's --parallel (<= STREAMS)
ROUND_ROWS=16                    # a round's rows at most (max verify rows): TF_DS_ROUND_ROWS / rank 1 --round-rows
CHUNK_ROWS=2048                  # prompt chunk rows: fixed in the engine (model.chunk_rows), recorded, not settable
DRAFTS=1
DRAFT_BYPASS_AT=6                # TF_DS_DRAFT_BYPASS_AT (rank 0): from this many active streams a round verifies
                                # pending rows alone and runs no head pass (drafts-off rounds), drafting again
                                # below it; 0 off. Resolves to 0 unless DRAFTS=1, WORLD=2 and STREAMS >= it.
MODALITIES=text                  # text capability (D13): TF_DS_MODALITIES / rank 1 --modalities
GRAPHS=1                         # TF_DS_GRAPHS: the rounds' stretches as HIP graphs; needs COLL_KIND=proxy or verbs (host is
                                 # not capturable)
GRAPHS_EAGER=                    # TF_DS_GRAPHS_EAGER (both ranks): N = every Nth round runs eagerly, not from its graphs
                                 # (a check that the eager path leaves the graphs' state); empty: never
ROUND_MS=36.06,43.76,50.38,56.29,59.52,61.52,66.27,71.02,75.77,80.52,85.27,90.02,94.77,99.52,104.27,109.02
# TF_DS_ROUND_MS: amd-1 through 6 rows; rows 7-16 extend by 4.75 ms/row from measured multi-stream rounds.
# 2026-10-20 mb5 screen: C2 +6.7%, C4 +5.6%, identical completion hashes; full qualification required before promotion.
DRAFT_MS=0                       # TF_DS_DRAFT_MS: 0 = amd-1 rounds already include the drafter pass (empty: GB10s 3.5)
FIX_K=                           # TF_DS_FIX_K (rank 0, a cost measurement): every drafted stream verifies FIX_K drafts a
                                 # round; empty: the profile chooses
FROZEN_TIMING=                   # TF_LANES_FROZEN_TIMING (rank 0): 1 = draft widths from the cost tables only, never from
                                 # measured round times, so two runs of a request take the same widths (repeatability)
TRACE_ROUNDS=                    # TF_DS_TRACE_ROUNDS (rank 0): 1 = a line a verify window in rank0.log (position, rows,
                                 # ids, drawn tokens); 2 = also each row's two best tokens and logits (slower)
ARENA_GIB=0                      # TF_DS_ARENA_GIB: 0 = the arena grows as the buffers ask
PREFILL_SPLIT=256                # TF_DS_PREFILL_SPLIT (default 256; serve_lib clears it above CONTEXT 16384): empty/0 off; ROWS: a prompt chunk whose first half would hold
                                 # >= ROWS rows runs as two halves zipped layer by layer, each half's gathers moving
                                 # while the other half computes (model.zig fillSplit; both ranks alike)
PREFILL_SPLIT_LARGE=1            # keep the split above CONTEXT 16384: p-pre2 2026-10-20, CONTEXT 63,488, fd65f28: prompt reading +34% (11,594 tok 1,101 -> 1,476; 34,287 tok 1,110 -> 1,486), identical prompt-logits SHAs, +0.62-0.68 GiB per rank (MemAvailable floor 16.4 GiB); 0 = old behaviour
PREFILL_SPLIT_ZIP=               # TF_DS_PREFILL_SPLIT_ZIP: 0 runs a split chunk's halves one after the other (no
                                 # overlap; the same rows as the zip, to compare results)
LOGITS_SHA=                      # TF_DS_LOGITS_SHA (rank 0) / --logits-sha (rank 1): 1 logs each prompt's logits'
                                 # SHA-256 (comparing two builds or settings)
HIP_DEVICE=0                     # TF_HIP_DEVICE
MEMORY_LIMIT_GB=110              # TENSORFOLD_HIP_MEMORY_LIMIT_GB (w-link's allocation gate)
PEAK_GIB=101                     # a rank's peak memory (GTT + RSS) at CONTEXT 8192, 1 stream: q-qual's ledger saw
                                 # MemAvailable fall from 117 to 16.7 GiB during the load. A rank starts only with
                                 # MemAvailable >= PEAK_GIB + 8 and no other engine on the box (U25); raise it with
                                 # CONTEXT, STREAMS or ARENA_GIB
VERIFY_REPORT=1                  # 1: a rank starts only if this box's verify_inputs.sh report passed for BUNDLE_SHA256
                                 # (U16; the rank cache's file name is always checked against the manifest)
GPU_STRICT=0                     # TF_GPU_STRICT: 1 checks every launch against its kernel's metadata and refuses a
                                 # Triton launch without its own variant; 0 until the kit has _sparse_attn_merge_rot2
                                 # for every row count (a prompt of 31 rows runs a variant that assumes less)
AUX=hip                          # TF_DS_AUX: w-tri's HIP kernels in place of Triton launches and the gates' hipBLAS
                                 # GEMMs: hip (all) | triton (none) | a list of attn,index,hc,gate,idxw,rope (both
                                 # ranks alike: the handshake compares it)
# the 2x Spark served config's engine settings (PLAN-research-actions.md R1, R7), each off until its evidence decides
REPLAY_FLOOR=0                   # TF_DS_REPLAY_FLOOR (both ranks; the handshake compares it): 1 = a <= 16-row last
                                 # chunk whose window reaches below the replay floor reads by the gather path, not the
                                 # slot's ring (off: it reads up to 15 keys of the request served before; A1)
HC_SIDE=0                        # TF_DS_HC_SIDE on rank 0, --side on rank 1 (rank-local): the decode rounds' mixes'
                                 # side work on a stream of its own (A2)
ENGRAM_AIO=0                     # TF_DS_ENGRAM_AIO on rank 0, --aio on rank 1 (rank-local): Engram reads by Linux AIO
                                 # on O_DIRECT, rounds and prompt chunks (A3)
L2_PREFETCH=0                    # EXPERIMENTAL, k-dec2's MALL prefetch: 1 = TF_DS_L2_PREFETCH on rank 0, --prefetch 1 on
                                 # rank 1 (rank-local): the decode rounds touch the next kernels' weights into the 32 MB
                                 # memory-side cache on a stream of their own (the kit's exl3.l2_prefetch; a kit without
                                 # it refuses at load). It also sets DEBUG_HIP_GRAPH_SEGMENT_SCHEDULING=1 on both ranks, a
                                 # HIP debug variable: without it graph replay runs the forked prefetch serially

# ---- the server (rank 0)
SERVE_HOST=127.0.0.1
SERVE_PORT=18081
SERVE_NAME=dsv41
TEMPERATURE=0                    # greedy
MAX_TOKENS=65536                 # --max-tokens: a request without max_tokens gets this, clamped to the context the pool
                                 # holds after its prompt (W - N; W = /v1/models max_model_len, 8,174 at CONTEXT 8192); an
                                 # explicit max_tokens over W - N is refused (400). Each stream reserves its prompt + max_tokens
                                 # of the pool, so with STREAMS > 1 a request without max_tokens holds the rest of it
TOP_K_MAX=0                      # TF_TOP_K_MAX: N > 0 = a sampled request's top_k omitted or <= 0 becomes 20 and one
                                 # above N becomes N (the sampler takes at most 56); 0 = off: the server refuses them, a
                                 # 400 naming top_k (A4, U49)
SEED_RANDOM=0                    # TF_SEED_RANDOM: 1 = a sampled request without a seed draws a fresh one (off: keyed
                                 # to the prompt); a request's own seed is kept either way (A4)
THINKING=0                       # 0: --no-thinking (first light answers directly); 1: --thinking
PROMPT_CACHE_GIB=0               # no kept prompt states for first light

# ---- readiness, the probe request, shutdown
LOCK_WAIT_S=1800                 # node0's GPU lock: first_light.sh waits this long for it (node0 first)
LOCK_PAIR_S=60                   # then node1's within this, else node0's is released and the pair retried after 30 s
LOCK_TRIES=20                    # (all or nothing), at most this many times
READY_TIMEOUT_S=1800             # the weights load, the peers link and the server answers /health within this
PROBE_PROMPT='Answer in one sentence: what is the capital of France?'
PROBE_EXPECT='Paris'             # the probe's reply must contain this (case-insensitive)
PROBE_MAX_TOKENS=64
PROBE_TIMEOUT_S=600
STOP_TIMEOUT_S=120               # SIGTERM, then SIGKILL after this

# ---- the timed run (first_light.sh after ready, inside halo-quiet windows on both boxes: node0, then node1)
BENCH=1
BENCH_CASES=code,prose,prefill   # the requests (bench_stream.py), one after another, each streamed and greedy: code and
                                 # prose are the decode cases (fixed prompts of about 30 tokens), prefill the
                                 # BENCH_REPEAT prompt; each: TTFT, decode tok/s after the first token
BENCH_REPEAT=180                 # the prefill prompt: a sentence BENCH_REPEAT times, then a question (180: 1,818
                                 # tokens, one chunk)
BENCH_MAX_TOKENS=400             # each request's tokens
RUN_ROOT='$HOME/tfp/run/serve'   # each run's directory: logs, pids, resolved.json, the probe's reply

RANK0_HOST=fuzzy
RANK1_HOST=misty
MASTER_IP=192.168.241.1
TP_STRIPE=
COLL_KIND=proxy
COLL_VERBS_DEVICE_RANK0=usb4_rdma0
COLL_VERBS_DEVICE_RANK1=usb4_rdma0
COLL_PROXY_STRIPE_KIB=0
DEPLOY_DIR='$HOME/.local/state/strixfold-weights/deploy-a4e4814'
BUNDLE='$HOME/models/strixfold/inputs-tp2-c178a012'
DS_KIT='$BUNDLE/kit'
ENGRAM_DIR='$HOME/models/strixfold/ds1017-1bae0e10'
WRAP0="$HOME/.local/state/strixfold-weights/deploy-a4e4814/run-native.sh"
WRAP1="$WRAP0"
RUN_ROOT='$HOME/.local/state/strixfold-weights/serve-verbs'
BENCH=0
BUNDLE_SHA256=89bbafead4fd2551f26174df16481270c3676ca40b93774499e1e84440b9d3bf
